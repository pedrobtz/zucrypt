# README.md is rendered from README.Rmd, and this checks it still is.
#
# Bespoke because r-actions has no README workflow. It exists because the
# hand-written README once printed a digest that was not SHA-256 of its
# input (#36): example output typed by a person drifts, output computed by
# the package cannot. Re-render, then fail on any difference.
#
# README.Rmd renders with pandoc's --wrap=preserve, so the source's line
# breaks survive and a different pandoc version on the runner does not
# re-flow every paragraph into a false difference.
#
# Gated through r-actions' `changes` gate (#146), so a pull request of prose
# only skips it. README.md is prose to that gate, so a pull request that
# edits README.md alone, by hand, is not checked here; the weekly schedule
# re-renders main and catches it there.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "53 19 * * 6"
  pull_request:
    # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

name: readme.yaml

permissions:
  contents: read

jobs:
  changes:
    # Labels are in the event, so this skips without a runner (ci.md).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:readme'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: readme

  readme:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, any::knitr, local::.
          dependencies: '"hard"'

      - name: README.md is what README.Rmd renders to
        run: |
          Rscript -e 'rmarkdown::render("README.Rmd", quiet = TRUE)'
          if ! git diff --exit-code README.md; then
            echo "::error::README.md differs from a fresh render of README.Rmd. Edit README.Rmd and run devtools::build_readme()."
            exit 1
          fi
          echo "ok  README.md matches a fresh render"
