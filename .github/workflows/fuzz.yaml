# Fuzz the adapter's untrusted-input boundaries (#94): the key reader,
# AES-GCM decryption and signature verification. Each harness in fuzz/
# carries an oracle and aborts when it does not hold, so a wrong answer is a
# finding just as a memory error is.
#
# Bespoke rather than r-actions' fuzz.yml, for two things it does not do:
# replay the committed corpus on every OS (Rtools included), and run several
# targets from one Makefile that already knows the backend's build. The
# pattern is zuhttp's fuzz.yaml.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled`, so that adding or removing a CI label reruns it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Seconds per target for the soak
        required: false
        default: '3600'

name: fuzz.yaml

permissions: read-all

jobs:
  # The shared gate: skips a documentation-only change, honours ci:minimal
  # and skip-ci:fuzz, and resolves the profile -- quick on a pull request,
  # full on the schedule, a dispatch or a full-ci pull request.
  changes:
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1.35.0
    with:
      name: fuzz
      profile: auto

  # The corpus as a regression suite: every seed, regress-* included,
  # through every oracle, plainly and under ASan + UBSan. Linux here; the
  # macOS and Windows replays run in platforms.yaml (tools/ci/platform.sh)
  # on the full profile.
  replay:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: Corpus replay (ubuntu-latest)
    steps:
      - uses: actions/checkout@v6
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Replay every seed
        working-directory: fuzz
        run: make -j4 replay-run
      # ASan is what makes an over-read in a replayed seed a failure rather
      # than a silent pass.
      - name: Replay under ASan + UBSan
        working-directory: fuzz
        run: make -j4 replay-asan FUZZ_CC=clang

  # Coverage-guided fuzzing: 30 s a target on a pull request, 10 minutes
  # on the full profile; the hour-long soak below is the schedule's.
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: libFuzzer (${{ needs.changes.outputs.profile }} profile)
    steps:
      - uses: actions/checkout@v6
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and run
        working-directory: fuzz
        run: |
          secs=30
          if [ "${{ needs.changes.outputs.profile }}" = full ]; then secs=600; fi
          make -j4 fuzz-run SECS="$secs" FUZZ_CC=clang
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/crash-*
          if-no-files-found: ignore

  soak:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    name: libFuzzer soak (${{ matrix.target }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [pkey, gcm, verify]
    steps:
      - uses: actions/checkout@v6
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Soak ${{ matrix.target }}
        working-directory: fuzz
        run: |
          SECS="${{ github.event.inputs.soak_seconds || 3600 }}"
          make -j4 fuzz_${{ matrix.target }} FUZZ_CC=clang
          mkdir -p work/${{ matrix.target }}
          ./fuzz_${{ matrix.target }} work/${{ matrix.target }} \
            corpus/${{ matrix.target }} -max_total_time="$SECS" \
            -print_final_stats=1 -artifact_prefix=./crash-${{ matrix.target }}-
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-crashes-${{ matrix.target }}
          path: fuzz/crash-*
          if-no-files-found: ignore
      # A soak that finds new coverage keeps it: merge the grown corpus into
      # fuzz/corpus by hand when it is worth committing.
      - name: Upload the grown corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/work/${{ matrix.target }}
          if-no-files-found: ignore
