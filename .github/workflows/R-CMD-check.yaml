# R CMD check, on the GitHub runners and in the CRAN-like containers, from the
# shared reusable workflow in pedrobtz/r-actions.
#
# Every r-actions call in this repo is pinned to a commit, with the tag in a
# trailing comment. A tag is mutable, so `@v1` means "whatever it points at
# when the job starts". Bump the pins deliberately, reading the diff.
#
# This replaces the r-lib/actions template that came with the package
# skeleton. The trade is the usual one: five runner legs become four, and in
# exchange the check reaches the two r-devel Linux flavors CRAN actually uses
# -- clang 23 building C as -std=gnu23, and GCC 16 -- which no GitHub runner
# provides.
#
# That gap is the entire reason to adopt this before there is any C to check.
# design.md §4 commits this package to vendoring the Mbed TLS / TF-PSA-Crypto
# crypto subset, and vendored code is written against the compilers upstream
# tests on. Its warnings arrive in *our* check log. `-pedantic`, which CRAN
# passes and no runner does, is what enables several of the diagnostics that
# would otherwise show up as a rejected submission rather than a red check --
# so the first vendoring commit lands with this already in place rather than
# discovering the toolchain gap afterwards.
#
# The dropped ubuntu/devel row is not a loss: it pinned R-devel to the
# runner's own GCC, which matches no CRAN flavor and is strictly worse than
# the containers that now cover it.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@1878271fd55900994a1b04dae87dd2d23af547a1 # v1.9.0
    with:
      # The default matrix plus one leg at the version DESCRIPTION declares.
      #
      # `Depends: R (>= 4.1)` was a claim inherited from the family, not a
      # measurement: release and oldrel-1 prove the package works on two
      # recent versions and say nothing about the floor. A declared minimum
      # nobody checks is the kind of thing that is wrong for two years and
      # then breaks one user's install.
      #
      # Roadmap Stage 5 asks for the minimum R version the build actually
      # needs to be recorded. This is that, kept honest by a job rather than
      # by a comment.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"},
         {"os": "ubuntu-latest", "r": "4.1"}]

      # CRAN's NOSUGGESTS flavor. This package's only Suggests is testthat,
      # which is exactly the dependency most easily used unguarded: a helper
      # calling library(testthat) at top level, or -- once the C API lands --
      # an example that builds the consumer fixture without checking that its
      # toolchain is there. Those error here and nowhere else.
      nosuggests: true

      # `nold` is deliberately off. It is R built --disable-long-double, and
      # it catches arithmetic relying on 80-bit intermediates -- numeric
      # parsing, formatting, comparison. This package's arithmetic is on
      # byte lengths and block counts (design §11: "Validate lengths and
      # arithmetic before allocation"), all integral. arch.yml's 32-bit leg
      # is the job that tests *that* arithmetic; see .agents/roadmap.md.
      nold: false
