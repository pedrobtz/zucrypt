# Architectures R-CMD-check.yaml does not reach.
#
# That workflow covers CRAN's compilers well and its architectures not at all:
# every leg there is x86-64 glibc. The 32-bit leg is the one that matters for
# this package. size_t narrows to 32 bits there, and every length check, block
# count and "is this a multiple of 16" becomes different arithmetic -- a bound
# computed as a product can overflow while being nowhere near the limit on
# 64-bit. The musl leg costs little alongside it, and neither needs QEMU.
#
# Weekly rather than per-push: these are container builds from source, they
# are slow, and the arithmetic they exercise changes rarely. A break here is
# worth knowing about within a week, not within a minute.
#
# aarch64 is in the list as of v0.1.0, per the roadmap. It is the leg that
# actually costs QEMU, and it is also the platform a large part of the world
# now develops on, so its bugs tend to be found already -- which is why it
# waited until a release was near rather than running from Stage 5.
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

name: arch.yaml

permissions: read-all

jobs:
  arch:
    uses: pedrobtz/r-actions/.github/workflows/arch.yml@68c22c173f9ddbb7e51284fe230053174e941afc # v1.15.0
    with:
      # The Debian legs install testthat from Debian's own binary rather than
      # building it, and generate en_US.UTF-8: R CMD check sets that locale,
      # and an image that cannot honour it turns every check into a WARNING
      # -- which is what the first run of this job showed on i386 and aarch64
      # (#31), green, because nothing failed on a WARNING yet.
      targets: >-
        [{"name": "i386", "platform": "linux/386",
          "image": "i386/debian:bookworm",
          "setup": "apt-get update && apt-get install -y --no-install-recommends r-base-dev r-cran-testthat locales && sed -i 's/^# *en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen"},
         {"name": "musl", "platform": "linux/amd64",
          "image": "alpine:3.21",
          "setup": "apk add --no-cache R R-dev R-doc build-base"},
         {"name": "aarch64", "platform": "linux/arm64",
          "image": "arm64v8/debian:bookworm",
          "setup": "apt-get update && apt-get install -y --no-install-recommends r-base-dev r-cran-testthat locales && sed -i 's/^# *en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen"}]

      # testthat, and nothing else. With no Suggests installed,
      # tests/testthat.R's requireNamespace() guard skips the whole suite and
      # R CMD check reports that as a pass: the first run of this job
      # executed zero tests on all three legs (#31). Debian ships testthat as
      # a binary (see setup); Alpine has none, so it is built from source
      # here. openssl stays out: its tests skip_if_not_installed(), and
      # building libssl bindings in every container would test OpenSSL's
      # portability, not this package's.
      install-dependencies: >-
        Rscript -e 'if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat", repos = "https://cloud.r-project.org")'

      # Red on a WARNING, and red unless some expectation actually passed.
      # Both are the two ways this job was green while proving nothing.
      error-on: warning
      require-tests: true
