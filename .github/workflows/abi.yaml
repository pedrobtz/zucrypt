# Guards the public C ABI surface.
#
# Bespoke by necessity: r-actions has no ABI workflow, because what a package
# publishes is specific to that package. This is zukomp's shape, adapted.
#
# design.md section 3 requires inst/include/zucrypt.h to compile standalone as
# C99 against only <stddef.h> and <stdint.h>, naming neither R nor the
# vendored backend. That property is invisible to R CMD check -- the header is
# only ever compiled there as part of a translation unit that already includes
# R's -- so it is checked here instead.
#
# Whether a push or pull request runs these is r-actions' `changes` gate,
# the same one native-checks.yaml's jobs use, rather than a paths-ignore list
# of its own: prose and repository housekeeping skip it (testthat snapshots,
# Markdown under tests/, count as code), and so does a pull request labelled
# `skip-ci:abi` or `ci:minimal`. Labels apply to pull requests only, so
# the push to main after merge still runs it.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "28 19 * * 6"
  pull_request:
    # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

name: abi.yaml

permissions: read-all

jobs:
  changes:
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: abi

  standalone-header:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    name: zucrypt.h standalone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in platforms.yaml (tools/ci/platform.sh).
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The standalone steps need no R; the consumer probes below compile
      # against R.h and so need $(R RHOME) to resolve.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The same checks run on macOS from tools/ci/platform.sh
      # (platforms.yaml); the script is shared so the two cannot drift.
      - name: zucrypt.h and zucrypt-r.h compile standalone
        run: bash tools/ci/check-header.sh

      # ABI 1 against what v0.1.0 published (#139): every enumerator, macro
      # and field of the frozen headers in tools/abi/v0.1.0/ keeps its value
      # and place, and a consumer compiled against them runs its vectors
      # through the current archive. macOS runs it in platform.sh.
      - name: ABI 1 against the v0.1.0 headers
        run: bash tools/ci/check-abi.sh
