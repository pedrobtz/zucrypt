# Execute the out-of-memory paths, which nothing else does.
#
# This is the direct test of a sentence in design.md section 11 that no other
# job reaches: "destroy partial contexts after any failed initialization".
# Nothing in an ordinary suite makes malloc fail, so that code is executed
# zero times. ASan and valgrind check what happens to memory that *was*
# allocated; gctorture forces collections rather than failures; rchk reasons
# about PROTECT rather than about a NULL return.
#
# Weekly, because the sweep restarts the process once per injected failure and
# the paths it covers change rarely.
on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

name: alloc-failure.yaml

permissions: read-all

jobs:
  alloc-failure:
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      # R_ENABLE_JIT=0, and the same script's prefix as the baseline: see the
      # header of tools/alloc-exercise.R. Together they put the sweep's
      # window on the crypt_* calls rather than on R's startup, its
      # byte-code compiler and utils::packageVersion() -- which is where the
      # first run's 300 positions all landed, failing nothing of ours (#31).
      run: R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R --baseline

      # The whole window. It was 192 allocations when measured on 2026-09-25
      # (rocker/r-ver, R 4.6.1); the cap is headroom, not a sample. RSA
      # (Stage 15a) took it to about 2,000 on macOS, 2026-11-03, and Linux
      # allocates more for the same work, so the cap is 4000: a window cut
      # short would leave the workload's tail unswept and say nothing.
      # Elliptic curves (Stage 16a) took it to about 13,000: see
      # tools/alloc-exercise.R for what the window holds and what it leaves
      # out. At about 0.2 s a position, that is some 45 minutes.
      max-allocations: 16000
      timeout-minutes: 90

      # What makes this "behaved" rather than "did not crash". The workload
      # checks every result against bytes openssl and hashlib computed
      # (tools/alloc-expected.tsv, #115): a wrong result exits 3 and prints
      # "WRONG RESULT", which matches nothing here, so the sweep reports it.
      # A failure prints its condition's class and message: zucrypt's
      # memory class, or one of R's out-of-memory errors, which come in
      # several wordings. Only the memory class: an injected allocation
      # failure reported as any other zucrypt condition ("not a key", say)
      # is a wrong answer, and the backend is known to turn allocation
      # failures into such codes (CLAUDE.md, Stage 15a). Until #115 only
      # two of R's were listed, and zuhttp saw its correct refusals counted
      # as silent failures for want of the others.
      expect-pattern: "zucrypt_memory_error|cannot allocate|could not allocate|memory exhausted|[Oo]ut of memory|out of virtual memory|allocation (error|of .* failed)"

      # Base R segfaults when the TRE regex compiler or gzfile() gets a
      # failed allocation (an R bug, not ours; zuhttp#282). A crash whose top
      # R frame is one of those is listed apart; one under .Call into
      # zucrypt still fails the job.
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|regexpr|gregexpr|strsplit|gzfile)\\("

      # And proof the sweep reached the adapter at all: 77 of the 192
      # injected failures did, on 2026-09-25. Twenty is a floor well under
      # that, so a sweep that silently stopped reaching zucrypt goes red.
      target-pattern: "ZUC_ERR_MEMORY"
      min-target-hits: 20
